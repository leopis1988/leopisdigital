<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | LeoPis Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 20px; color: #1e293b; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 500; color: #64748b; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit; }
        button:hover { background: #1d4ed8; }
        .hidden { display: none; }
        .logout-btn { background: #ef4444; margin-top: 10px; }
        .logout-btn:hover { background: #dc2626; }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-box" id="loginBox">
        <h2>Admin Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
    
    <!-- Admin Panel (Hidden by default) -->
    <div class="login-box hidden" id="adminPanel">
        <h2>Admin Dashboard</h2>
        
        <label>Total Website Visits</label>
        <input type="number" id="editVisits">
        
        <label>Total Completed Orders</label>
        <input type="number" id="editOrders">
        
        <button onclick="saveStats()">Save Changes</button>
        <button onclick="logout()" class="logout-btn">Logout</button>
    </div>

    <script>
        // Hidden Security Credentials
        const ADMIN_USER = "Leopis";
        const ADMIN_PASS = "Leopis@1988";

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadStats();
            } else {
                alert("Invalid credentials. Please try again.");
            }
        }

        function loadStats() {
            // Load current stats from LocalStorage
            document.getElementById('editVisits').value = localStorage.getItem('leopis_visits') || 12450;
            document.getElementById('editOrders').value = localStorage.getItem('leopis_orders') || 1850;
        }

        function saveStats() {
            // Save edited stats to LocalStorage
            const newVisits = document.getElementById('editVisits').value;
            const newOrders = document.getElementById('editOrders').value;
            
            localStorage.setItem('leopis_visits', newVisits);
            localStorage.setItem('leopis_orders', newOrders);
            
            alert("Dashboard statistics updated successfully!");
        }

        function logout() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
