<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1530">
<title>Leopis Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#0b1530;color:#eef1f8}
button,input,select,textarea{font:inherit}
input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;border-radius:8px;border:1px solid #2b3a63;background:#13204a;color:#fff}
textarea{min-height:70px}label{font-size:12px;color:#9fb0d8}
button{padding:10px 14px;border:0;border-radius:8px;background:linear-gradient(90deg,#f5b301,#ff5a1f);color:#111;font-weight:700}
button.g{background:#22305c;color:#fff}button.r{background:#b3261e;color:#fff}
.box{max-width:420px;margin:12vh auto;padding:22px}.wrap{max-width:760px;margin:auto;padding:12px}
h1,h2{margin:6px 0}.top{display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}.tabs button{background:#22305c;color:#fff;white-space:nowrap}.tabs button.on{background:#f5b301;color:#111}
.row{display:flex;gap:10px;align-items:center;background:#13204a;border-radius:10px;padding:8px;margin:6px 0}
.row img{width:54px;height:54px;object-fit:cover;border-radius:8px;background:#22305c}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:14px}.row .t small{color:#9fb0d8}
.row button{padding:8px 10px}.f{display:flex;gap:8px;flex-wrap:wrap}.f>*{flex:1;min-width:110px}
#modal{position:fixed;inset:0;background:#000b;overflow:auto;padding:10px}#modal>div{max-width:560px;margin:auto;background:#0f1a3d;padding:14px;border-radius:12px}
.ok{color:#5ee08a}.er{color:#ff8b84}[hidden]{display:none!important}
</style></head><body>

<div id="login" class="box" hidden>
 <h1>Leopis Admin</h1><p>Sign in to manage your store.</p>
 <input id="em" type="email" placeholder="Email" autocomplete="username">
 <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
 <button id="go" style="width:100%">Login</button><p id="msg" class="er"></p>
</div>

<div id="app" class="wrap" hidden>
 <div class="top"><h1>Leopis Admin</h1><button class="g" id="out">Logout</button></div>
 <div class="tabs" id="tabs">
  <button data-t="products">Products</button><button data-t="promos">Promo codes</button>
  <button data-t="settings">Delivery</button><button data-t="tools">Import &amp; Tools</button>
 </div>
 <div id="v"></div>
</div>
<div id="modal" hidden><div id="mb"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://efnpwdugjmjzqdkgdawa.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmbnB3ZHVnam1qenFka2dkYXdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MDMzODQsImV4cCI6MjExMTA3OTM4NH0.5eA1PMXmaiFh5ZxfxAxI16bcPfn2-I1yaw5EUQyJjAI');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{v=parseFloat(String(v??'').replace(/[^0-9.]/g,''));return isNaN(v)?null:v};
let page=0,PS=20,F={q:'',cat:'',mer:'',feat:false,hid:false},rows={},CATS=null,staged=[];

(async()=>{const{data:{session}}=await sb.auth.getSession();session?enter():show(0)})();
function show(a){$('login').hidden=a;$('app').hidden=!a}
$('go').onclick=async()=>{$('msg').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});error?$('msg').textContent=error.message:enter()};
$('out').onclick=async()=>{await sb.auth.signOut();show(0)};
async function enter(){const{data}=await sb.rpc('is_admin');if(!data){await sb.auth.signOut();show(0);$('msg').textContent='This account is not an admin yet.';return}show(1);tab('products')}
$('tabs').onclick=e=>e.target.dataset.t&&tab(e.target.dataset.t);
function tab(t){[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t==t));({products:pView,promos:prView,settings:sView,tools:tView})[t]()}
async function cats(){if(CATS)return CATS;const s=new Set();for(let i=0;;i++){const{data}=await sb.from('products').select('category').range(i*1000,i*1000+999);(data||[]).forEach(r=>r.category&&s.add(r.category));if(!data||data.length<1000)break}return CATS=[...s].sort()}
const opts=(a,sel)=>a.map(c=>`<option ${c==sel?'selected':''}>${esc(c)}</option>`).join('');

/* PRODUCTS */
async function pView(){
 const c=await cats();
 $('v').innerHTML=`<div class="f"><input id="q" placeholder="Search name or code" value="${esc(F.q)}"><select id="fc"><option value="">All categories</option>${opts(c,F.cat)}</select>
 <select id="fm"><option value="">All merchants</option>${[1,2,3].map(m=>`<option ${F.mer==m?'selected':''} value="${m}">Merchant ${m}</option>`).join('')}</select></div>
 <label><input type="checkbox" id="ff" ${F.feat?'checked':''} style="width:auto"> Featured only</label> &nbsp; <label><input type="checkbox" id="fh" ${F.hid?'checked':''} style="width:auto"> Hidden only</label>
 <div class="top"><b id="cnt"></b><button onclick="edit()">+ Add product</button></div><div id="list"></div>
 <div class="top"><button class="g" id="pv">Prev</button><button class="g" id="nx">Next</button></div>`;
 const go=()=>{F.q=$('q').value;F.cat=$('fc').value;F.mer=$('fm').value;F.feat=$('ff').checked;F.hid=$('fh').checked;page=0;load()};
 $('q').onchange=$('fc').onchange=$('fm').onchange=$('ff').onchange=$('fh').onchange=go;
 $('pv').onclick=()=>{if(page>0){page--;load()}};$('nx').onclick=()=>{page++;load()};load();
}
async function load(){
 let q=sb.from('products').select('*',{count:'exact'}).order('id',{ascending:false}).range(page*PS,page*PS+PS-1);
 if(F.q){const s=F.q.replace(/[,()%*]/g,' ');q=q.or(`name.ilike.%${s}%,code.ilike.%${s}%`)}
 if(F.cat)q=q.eq('category',F.cat);if(F.mer)q=q.eq('merchant',F.mer);if(F.feat)q=q.eq('featured',true);if(F.hid)q=q.eq('active',false);
 const{data,count,error}=await q;if(error){$('list').innerHTML='<p class="er">'+esc(error.message)+'</p>';return}
 rows={};$('cnt').textContent=count+' products';
 $('list').innerHTML=(data||[]).map(p=>{rows[p.id]=p;return`<div class="row"><img src="${esc(p.image)}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
 <div class="t"><b>${esc(p.name)}</b><small>${esc(p.code)} · Rs. ${p.price} · M${p.merchant}${p.active?'':' · HIDDEN'}</small></div>
 <button class="g" onclick="flag(${p.id},'featured')">${p.featured?'★':'☆'}</button><button class="g" onclick="flag(${p.id},'active')">${p.active?'👁':'🚫'}</button><button onclick="edit(${p.id})">Edit</button></div>`}).join('')||'<p>No products found.</p>';
}
async function flag(id,k){const{error}=await sb.from('products').update({[k]:!rows[id][k]}).eq('id',id);error?alert(error.message):load()}
const FL=[['code','Code'],['name','Name'],['name_si','Name (Sinhala)'],['name_ta','Name (Tamil)'],['category','Category'],['merchant','Merchant (1, 2 or 3)'],['price','Price (Rs.)'],['market_price','Crossed-out price (Rs.)'],['discount_percent','Discount %'],['warranty','Warranty'],['image','Main photo URL'],['description','Description','a'],['description_si','Description (Sinhala)','a'],['description_ta','Description (Tamil)','a'],['images','Extra photos (one URL per line)','a']];
function edit(id){
 const p=id?rows[id]:{merchant:2,price:0,discount_percent:0,active:true,featured:false,images:[]};
 $('mb').innerHTML=`<h2>${id?'Edit':'Add'} product</h2>`+FL.map(([k,l,t])=>{let v=k=='images'?(p.images||[]).join('\n'):(p[k]??'');return`<label>${l}</label>`+(t?`<textarea id="f_${k}">${esc(v)}</textarea>`:`<input id="f_${k}" value="${esc(v)}">`)}).join('')+
 `<label>Upload a photo (adds to extra photos)</label><input type="file" id="up" accept="image/*">
 <label><input type="checkbox" id="f_featured" ${p.featured?'checked':''} style="width:auto"> Featured</label> &nbsp; <label><input type="checkbox" id="f_active" ${p.active?'checked':''} style="width:auto"> Visible on website</label>
 <p id="em2" class="er"></p><div class="f"><button id="sv">Save</button><button class="g" onclick="$('modal').hidden=true">Cancel</button>${id?'<button class="r" id="dl">Delete</button>':''}</div>`;
 $('modal').hidden=false;
 $('up').onchange=async e=>{const f=e.target.files[0];if(!f)return;const n=Date.now()+'_'+f.name.replace(/[^\w.]/g,'_');const{error}=await sb.storage.from('product-images').upload(n,f);if(error)return alert(error.message);const u=sb.storage.from('product-images').getPublicUrl(n).data.publicUrl;$('f_images').value=($('f_images').value.trim()+'\n'+u).trim()};
 $('sv').onclick=async()=>{const o={};FL.forEach(([k])=>o[k]=$('f_'+k).value.trim()||null);
  ['merchant','price','market_price','discount_percent'].forEach(k=>o[k]=num(o[k]));o.price??=0;o.discount_percent??=0;o.merchant||=2;
  o.images=($('f_images').value.split('\n').map(s=>s.trim()).filter(Boolean));o.featured=$('f_featured').checked;o.active=$('f_active').checked;
  if(!o.name)return $('em2').textContent='Name is required';
  const{error}=id?await sb.from('products').update(o).eq('id',id):await sb.from('products').insert(o);
  if(error)return $('em2').textContent=error.message;$('modal').hidden=true;CATS=null;load()};
 if(id)$('dl').onclick=async()=>{if(!confirm('Delete this product?'))return;const{error}=await sb.from('products').delete().eq('id',id);error?alert(error.message):($('modal').hidden=true,load())};
}

/* PROMO CODES */
async function prView(){
 const{data,error}=await sb.from('promo_codes').select('*').order('created_at',{ascending:false});
 $('v').innerHTML=`<h2>Promo codes</h2><div class="f"><input id="pc" placeholder="CODE"><select id="pk"><option value="percent">% off</option><option value="fixed">Rs. off</option></select><input id="pv2" type="number" placeholder="Value"></div>
 <div class="f"><input id="pm" type="number" placeholder="Minimum order (Rs.)"><input id="pe" type="date"></div><button id="pa">Add code</button><p id="pm2" class="er"></p>`+
 (error?esc(error.message):(data||[]).map(r=>`<div class="row"><div class="t"><b>${esc(r.code)}</b><small>${r.kind=='percent'?r.value+'%':'Rs. '+r.value} off · min Rs. ${r.min_order}${r.expires_at?' · until '+r.expires_at.slice(0,10):''}${r.active?'':' · OFF'}</small></div>
 <button class="g" onclick="pt('${esc(r.code)}',${!r.active})">${r.active?'Turn off':'Turn on'}</button><button class="r" onclick="pd('${esc(r.code)}')">Delete</button></div>`).join(''));
 $('pa').onclick=async()=>{const code=$('pc').value.trim().toUpperCase(),v=num($('pv2').value);if(!code||!v)return $('pm2').textContent='Enter a code and a value';
  const{error}=await sb.from('promo_codes').insert({code,kind:$('pk').value,value:v,min_order:num($('pm').value)||0,expires_at:$('pe').value?$('pe').value+'T23:59:59+05:30':null});error?$('pm2').textContent=error.message:prView()};
}
async function pt(c,a){await sb.from('promo_codes').update({active:a}).eq('code',c);prView()}
async function pd(c){if(confirm('Delete '+c+'?')){await sb.from('promo_codes').delete().eq('code',c);prView()}}

/* DELIVERY + STORE */
async function sView(){
 const{data}=await sb.from('settings').select('*');const S=Object.fromEntries((data||[]).map(r=>[r.key,r.value]));const d=S.delivery||{},st=S.store||{};
 const g=(k,f)=>(d[k]||{})[f]??0;
 $('v').innerHTML=`<h2>Delivery charges</h2><p><small>Delivery fee by number of merchants in the cart, and the discount applied automatically.</small></p>`+
 [['one','1 merchant'],['two','2 merchants'],['three','3 merchants']].map(([k,l])=>`<div class="f"><div><label>${l}: fee (Rs.)</label><input id="d_${k}_fee" type="number" value="${g(k,'fee')}"></div><div><label>${l}: discount (Rs.)</label><input id="d_${k}_discount" type="number" value="${g(k,'discount')}"></div></div>`).join('')+
 `<h2>Store</h2><label>WhatsApp number</label><input id="s_wa" value="${esc(st.whatsapp||'')}"><button id="ss">Save</button> <span id="sm"></span>`;
 $('ss').onclick=async()=>{const nd={};['one','two','three'].forEach(k=>nd[k]={fee:num($('d_'+k+'_fee').value)||0,discount:num($('d_'+k+'_discount').value)||0});
  const{error}=await sb.from('settings').upsert([{key:'delivery',value:nd},{key:'store',value:{...st,whatsapp:$('s_wa').value.trim()}}]);
  $('sm').textContent=error?error.message:'Saved ✓';$('sm').className=error?'er':'ok'};
}

/* IMPORT & TOOLS */
function mapItem(o,i){
 const code=String(o.code||o.sku||o.id||o.productCode||('X'+(i+1))).trim();
 const imgs=o.images||o.gallery||o.photos||[];const A=Array.isArray(imgs)?imgs:String(imgs).split(/[\n,|]/).map(s=>s.trim()).filter(Boolean);
 const image=o.image||o.img||o.photo||o.thumbnail||A[0]||null;
 const src=String(o.supplier||o.source||o.brand||o.merchantName||'');
 let m=parseInt(o.merchant);if(![1,2,3].includes(m))m=/^P0/i.test(code)?1:(/fochant/i.test(src)?3:2);
 return{code,name:String(o.name||o.title||o.productName||'').trim()||code,category:o.category||o.cat||null,description:o.description||o.desc||null,
  price:num(o.price??o.selling_price??o.sellingPrice??o.rate)??0,market_price:num(o.market_price??o.marketPrice??o.oldPrice??o.old_price??o.mrp),
  discount_percent:num(o.discount_percent??o.discount)||0,warranty:o.warranty||null,image,images:A.filter(u=>u!==image),merchant:m,
  name_si:o.name_si||null,name_ta:o.name_ta||null,description_si:o.description_si||null,description_ta:o.description_ta||null,featured:!!o.featured,active:o.active!==false}
}
function stage(j){const a=Array.isArray(j)?j:(j.products||j.items||Object.values(j));const m=new Map();a.forEach((o,i)=>{const x=mapItem(o,i);m.set(x.code,x)});staged=[...m.values()];
 $('pvw').innerHTML=`<p class="ok">Found ${staged.length} products. Check the first 3:</p><pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify(staged.slice(0,3),null,1))}</pre><button id="ig">Import all ${staged.length} products</button> <span id="ip"></span>`;
 $('ig').onclick=async()=>{$('ig').disabled=true;for(let i=0;i<staged.length;i+=500){const{error}=await sb.from('products').upsert(staged.slice(i,i+500),{onConflict:'code'});if(error){$('ip').innerHTML='<span class="er">'+esc(error.message)+'</span>';return}$('ip').textContent='Imported '+Math.min(i+500,staged.length)+' / '+staged.length}$('ip').innerHTML='<span class="ok">Done ✓</span>';CATS=null}}
async function tView(){
 const c=await cats();
 $('v').innerHTML=`<h2>Import products</h2><p><small>Existing products with the same code are updated, new ones are added.</small></p>
 <button id="iw">Import from my website (products.json)</button><p><label>Or choose a products.json file</label><input type="file" id="if" accept=".json"></p><div id="pvw"></div><hr>
 <h2>Change all prices</h2><div class="f"><input id="bp" type="number" placeholder="% change (e.g. 5 or -10)"><select id="bc"><option value="">All categories</option>${opts(c)}</select><select id="bm"><option value="">All merchants</option><option>1</option><option>2</option><option>3</option></select></div>
 <button id="bb">Apply to matching products</button> <span id="bmsg"></span><hr><h2>Backup</h2><p><small>Free plan has no automatic backups. Download one every week.</small></p><button class="g" id="bk">Download backup</button>`;
 $('iw').onclick=async()=>{try{stage(await (await fetch('./products.json?'+Date.now())).json())}catch(e){$('pvw').innerHTML='<p class="er">Could not read products.json: '+esc(e.message)+'</p>'}};
 $('if').onchange=async e=>{try{stage(JSON.parse(await e.target.files[0].text()))}catch(x){$('pvw').innerHTML='<p class="er">'+esc(x.message)+'</p>'}};
 $('bb').onclick=async()=>{const p=num($('bp').value);if(p===null||!confirm('Change prices by '+p+'% for the selected products?'))return;
  const{data,error}=await sb.rpc('bulk_price',{p_percent:p,p_category:$('bc').value||null,p_merchant:parseInt($('bm').value)||null});$('bmsg').textContent=error?error.message:data+' products updated ✓'};
 $('bk').onclick=async()=>{let all=[];for(let i=0;;i++){const{data}=await sb.from('products').select('*').order('id').range(i*1000,i*1000+999);all=all.concat(data||[]);if(!data||data.length<1000)break}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(all)],{type:'application/json'}));a.download='leopis-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
}
</script></body></html>
