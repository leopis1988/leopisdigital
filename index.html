<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeoPis Digital | Premium Tech Store</title>
  
  <!-- SEO & GEO TAGS -->
  <meta name="description" content="Buy premium laptops, electronics, and accessories in Sri Lanka. Island-wide fast delivery.">
  <meta name="geo.region" content="LK">
  <meta name="geo.placename" content="Sri Lanka">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- INLINE CSS -->
  <style>
    :root {
      --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --muted: #64748b;
      --primary: #2563eb; --primary-dark: #1d4ed8; --whatsapp: #25d366;
      --border: #e2e8f0; --dark-bg: #0f172a; --radius: 8px; --font: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    .container { width: min(1280px, 96%); margin-inline: auto; }

    /* TOP BAR */
    .top-bar { background: #1e293b; color: #cbd5e1; font-size: 0.8rem; padding: 8px 0; text-align: center; }
    
    /* HEADER */
    .site-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 0; position: sticky; top: 0; z-index: 100; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    
    /* LOGO */
    .logo img { height: 35px !important; max-width: 120px !important; object-fit: contain !important; }
    
    /* SEARCH */
    .header-search { flex: 1; display: flex; align-items: center; max-width: 500px; background: #f1f5f9; border: 1px solid var(--border); border-radius: 8px; height: 38px; overflow: hidden; }
    .header-search input { flex: 1; border: none; outline: none; background: transparent; padding: 0 12px; font-size: 0.85rem; }
    .header-search button { background: var(--primary); color: #fff; border: none; padding: 0 15px; height: 100%; }
    
    /* NAV */
    .main-nav { background: var(--dark-bg); color: #fff; }
    .nav-inner { display: flex; gap: 20px; padding: 10px 0; overflow-x: auto; white-space: nowrap; }
    .main-nav a { font-size: 0.85rem; font-weight: 500; color: #cbd5e1; }
    .main-nav a:hover { color: #fff; }

    /* HERO */
    .hero { background: var(--dark-bg); color: #fff; padding: 30px 0; text-align: center; }
    .hero h1 { font-size: 1.8rem; margin-bottom: 10px; }
    .hero p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px; }

    /* CATEGORY */
    .category-section { background: var(--surface); padding: 10px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .category-chips { display: flex; gap: 10px; padding: 0 15px; width: max-content; }
    .chip { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 0.8rem; font-weight: 500; white-space: nowrap; }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* PRODUCTS */
    .shop-section { padding: 20px 0; }
    .section-head h2 { font-size: 1.2rem; margin-bottom: 15px; }
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .product-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .product-img { aspect-ratio: 1/1; background: #fff; padding: 10px; }
    .product-img img { width: 100%; height: 100%; object-fit: contain; }
    .product-body { padding: 10px; display: flex; flex-direction: column; flex: 1; }
    .product-name { font-size: 0.85rem; font-weight: 500; margin-bottom: 5px; height: 2.6em; overflow: hidden; }
    .product-price { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
    .product-actions { display: flex; gap: 5px; margin-top: auto; }
    .add-cart-btn { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid var(--primary); background: #fff; color: var(--primary); font-weight: 600; font-size: 0.75rem; }
    .add-cart-btn:hover { background: var(--primary); color: #fff; }
    .wa-quick-btn { width: 32px; background: #ecfdf5; color: var(--whatsapp); border: 1px solid #d1fae5; border-radius: 4px; display: grid; place-items: center; }

    /* FOOTER */
    .site-footer { background: var(--dark-bg); color: #94a3b8; padding: 30px 0; text-align: center; font-size: 0.85rem; }
    .site-footer img { height: 30px; margin: 0 auto 10px; }

    @media (min-width: 768px) {
      .product-grid { grid-template-columns: repeat(4, 1fr); }
      .hero h1 { font-size: 2.5rem; }
      .header-inner { flex-wrap: nowrap; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    🔥 Mega Sale! Island-wide delivery available
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="LeoPis Digital" />
      </a>
      <div class="header-search">
        <input type="search" id="searchInput" placeholder="Search products..." />
        <button><i class="fas fa-search"></i></button>
      </div>
      <div style="display:flex; gap:15px; align-items:center;">
        <button id="cartToggle" style="background:none; border:none; font-size:1.2rem; position:relative;">
          <i class="fas fa-shopping-cart"></i>
          <span id="cartCount" style="position:absolute; top:-5px; right:-8px; background:var(--primary); color:#fff; font-size:0.6rem; padding:2px 5px; border-radius:50%;">0</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="main-nav">
    <div class="container nav-inner">
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">Categories</a>
      <a href="#">FAQ</a>
      <a href="admin.html">Admin</a>
    </div>
  </nav>

  <section class="hero">
    <div class="container">
      <h1>Premium Products,<br>Delivered to You.</h1>
      <p>Order via WhatsApp in seconds. Fast Island-wide delivery.</p>
    </div>
  </section>
    <section class="category-section">
    <div class="category-chips">
      <button class="chip active">All Products</button>
      <button class="chip">Laptops</button>
      <button class="chip">Accessories</button>
      <button class="chip">Audio</button>
    </div>
  </section>

  <section class="shop-section">
    <div class="container">
      <div class="section-head">
        <h2>Featured Products</h2>
      </div>
      <div class="product-grid" id="productGrid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <img src="logo.png" alt="Logo">
      <p>&copy; 2024 LeoPis Digital. All rights reserved.</p>
    </div>
  </footer>

  <!-- CART DRAWER -->
  <div id="cartDrawer" style="position:fixed; top:0; right:-100%; width:100%; max-width:350px; height:100vh; background:#fff; z-index:200; box-shadow:-5px 0 15px rgba(0,0,0,0.1); transition:right 0.3s; display:flex; flex-direction:column;">
    <div style="padding:15px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
      <h3>Shopping Cart</h3>
      <button id="cartClose" style="background:none; border:none; font-size:1.2rem;"><i class="fas fa-times"></i></button>
    </div>
    <div id="cartItems" style="flex:1; padding:15px; overflow-y:auto;"></div>
    <div style="padding:15px; border-top:1px solid #eee;">
      <h4 style="margin-bottom:10px;">Total: <span id="cartTotal">LKR 0.00</span></h4>
      <button style="width:100%; padding:10px; background:#25d366; color:#fff; border:none; border-radius:5px; font-weight:bold;">Order via WhatsApp</button>
    </div>
  </div>

  <!-- INLINE JS -->
  <script>
    const PRODUCTS = [
      { id: 1, name: "MacBook Pro 14-inch M3", price: 550000, category: "Laptops", image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=400" },
      { id: 2, name: "Dell XPS 13 Plus", price: 420000, category: "Laptops", image: "https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=400" },
      { id: 3, name: "Logitech MX Master 3S", price: 28500, category: "Accessories", image: "https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=400" },
      { id: 4, name: "Sony WH-1000XM5", price: 95000, category: "Audio", image: "https://images.unsplash.com/photo-1618366712010-f4ae9c647dcb?w=400" }
    ];

    const grid = document.getElementById('productGrid');
    grid.innerHTML = PRODUCTS.map(p => `
      <article class="product-card">
        <div class="product-img">
          <img src="${p.image}" alt="${p.name}">
        </div>
        <div class="product-body">
          <h3 class="product-name">${p.name}</h3>
          <div class="product-price">LKR ${p.price.toFixed(2)}</div>
          <div class="product-actions">
            <button class="add-cart-btn" onclick="alert('Added to cart!')">Add to Cart</button>
            <button class="wa-quick-btn"><i class="fab fa-whatsapp"></i></button>
          </div>
        </div>
      </article>
    `).join('');

    const drawer = document.getElementById('cartDrawer');
    document.getElementById('cartToggle').onclick = () => drawer.style.right = '0';
    document.getElementById('cartClose').onclick = () => drawer.style.right = '-100%';
  </script>
</body>
</html>
