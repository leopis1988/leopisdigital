<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeoPis Digital | Premium Tech Store</title>
  
  <!-- SEO & GEO TAGS -->
  <meta name="title" content="LeoPis Digital | Premium Tech Store in Sri Lanka">
  <meta name="description" content="Buy premium laptops, electronics, and accessories in Sri Lanka. Island-wide fast delivery. Order via WhatsApp.">
  <meta name="keywords" content="Laptops Sri Lanka, Electronics, WhatsApp Order, LeoPis Digital">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://leopisdigital.com/">
  <meta name="geo.region" content="LK">
  <meta name="geo.placename" content="Sri Lanka">
  <meta name="geo.position" content="7.8731;80.7718">
  <meta name="ICBM" content="7.8731, 80.7718">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <!-- CSS LINK -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="top-bar" id="promoText">🔥 Island-wide delivery available</div>
  
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="logo"><img src="logo.png" alt="LeoPis Digital" /></a>
      <div class="header-search">
        <input type="search" id="searchInput" placeholder="Search products..." />
        <button><i class="fas fa-search"></i></button>
      </div>
      <button id="cartToggle" style="background:none; font-size:1.2rem; position:relative;">
        <i class="fas fa-shopping-cart"></i>
        <span id="cartCount" style="position:absolute; top:-5px; right:-8px; background:var(--primary); color:#fff; font-size:0.6rem; padding:2px 5px; border-radius:50%;">0</span>
      </button>
    </div>
  </header>
  
  <nav class="main-nav container"><a href="#">Home</a><a href="#shop">Shop</a><a href="admin.html">Admin</a></nav>

  <section class="hero">
    <div class="container">
      <h1>LeoPis Digital</h1>
      <p>Premium Products, Delivered. Order via WhatsApp.</p>
      <div class="stats-row">
        <div class="stat-box"><strong id="visitsCount">0</strong><span>Visits</span></div>
        <div class="stat-box"><strong id="ordersCount">0</strong><span>Orders</span></div>
        <div class="stat-box"><strong>4.9/5 <i class="fab fa-google" style="font-size:0.8rem;"></i></strong><span>Rating</span></div>
      </div>
    </div>
  </section>

  <section class="container" id="shop">
    <div class="product-grid" id="productGrid"></div>
  </section>

  <section class="faq-section" id="faq">
    <div class="container faq-grid">
      <div>
        <h2 style="margin-bottom:15px;">Frequently Asked Questions</h2>
        <div id="faqList"></div>
      </div>
      <div class="ai-box">
        <h3><i class="fas fa-robot" style="color:var(--primary)"></i> AI Assistant</h3>
        <p style="font-size:0.85rem; color:var(--muted); margin-bottom:10px;">Ask about delivery or payment.</p>
        <div id="aiMessages" style="height:150px; overflow-y:auto; background:#fff; border:1px solid #ddd; margin-bottom:10px; padding:10px; text-align:left; font-size:0.85rem;"></div>
        <div style="display:flex; gap:5px;">
          <input type="text" id="aiInput" placeholder="Type question..." style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px;">
          <button onclick="askAI()" style="background:var(--primary); color:#fff; padding:8px 12px; border-radius:4px;">Send</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <img src="logo.png" alt="LeoPis Digital">
      <div class="social-links" id="socialLinks"></div>
      <p>&copy; 2024 LeoPis Digital. All rights reserved.</p>
    </div>
  </footer>

  <!-- PRODUCT MODAL -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-content">
      <button onclick="closeModal()" style="position:absolute; right:10px; top:10px; font-size:1.2rem; background:none;"><i class="fas fa-times"></i></button>
      <div style="flex:1;">
        <img id="mImg" src="" style="width:100%; height:300px; object-fit:contain;">
        <div class="thumbnails" id="mThumbnails"></div>
      </div>
      <div style="flex:1;">
        <h2 id="mTitle" style="font-size:1.3rem;"></h2>
        <p id="mPrice" style="font-size:1.3rem; color:var(--primary); font-weight:bold; margin:10px 0;"></p>
        <p id="mDesc" style="font-size:0.9rem; color:var(--muted); margin-bottom:20px; white-space:pre-line;"></p>
        <button onclick="addToCartFromModal()" style="width:100%; padding:12px; background:var(--primary); color:#fff; border-radius:5px; margin-bottom:10px;">Add to Cart</button>
        <button onclick="waOrderFromModal()" style="width:100%; padding:12px; background:var(--whatsapp); color:#fff; border-radius:5px; font-weight:bold;"><i class="fab fa-whatsapp"></i> Order via WhatsApp</button>
      </div>
    </div>
  </div>

  <!-- CART -->
  <div class="cart-drawer" id="cartDrawer">
    <div style="padding:15px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
      <h3>Cart</h3><button onclick="document.getElementById('cartDrawer').classList.remove('open')"><i class="fas fa-times"></i></button>
    </div>
    <div id="cartItems" style="flex:1; padding:15px; overflow-y:auto;"></div>
    <div style="padding:15px; border-top:1px solid #eee;">
      <h4 style="margin-bottom:10px;">Total: <span id="cartTotal">LKR 0</span></h4>
      <button onclick="checkout()" style="width:100%; padding:10px; background:var(--whatsapp); color:#fff; border-radius:5px; font-weight:bold;"><i class="fab fa-whatsapp"></i> Checkout</button>
    </div>
  </div>

  <!-- JS LINK -->
  <script src="js/app.js"></script>
</body>
  </html>
