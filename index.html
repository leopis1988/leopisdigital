<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leopis Digital | Online Store Sri Lanka</title>
<meta name="description" content="Home appliances, kitchen, baby, headphones, fashion and fitness. Cash on delivery across Sri Lanka.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Noto+Sans+Sinhala:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#141c2b; --bg:#f4f6fa; --card:#fff; --line:#e3e8f0; --text:#1b2433; --muted:#6b778c;
  --gold:#ffc928; --red:#ef3b2d; --grad:linear-gradient(90deg,#ffc928,#ef3b2d); --wa:#25d366;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Montserrat","Noto Sans Sinhala","Noto Sans Tamil",system-ui,sans-serif;line-height:1.5}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.35rem 1rem;background:#0d1320;color:#cfd6e4;font-size:.8rem}
.langs{display:flex;gap:.25rem}
.langs button{padding:.2rem .6rem;border-radius:6px;border:1px solid #33425c;background:none;color:#cfd6e4;cursor:pointer}
.langs button.on{background:var(--gold);border-color:var(--gold);color:#1a1205;font-weight:600}

.head{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem;padding:.8rem 1rem;background:var(--navy)}
.brand{display:flex;align-items:center;text-decoration:none}
.brand img{height:56px;width:auto;border-radius:8px}
#q{flex:1 1 240px;min-width:0;padding:.75rem 1.2rem;border-radius:999px;border:0;background:#fff}
.cartbtn{padding:.65rem 1.2rem;border-radius:999px;border:0;background:var(--grad);color:#1a1205;font-weight:700;cursor:pointer}
.cartbtn b{background:#1a1205;color:var(--gold);border-radius:999px;padding:0 .55rem;margin-left:.3rem}

.catnav{display:flex;gap:.5rem;overflow-x:auto;padding:.6rem 1rem;background:#fff;border-bottom:1px solid var(--line);white-space:nowrap}
.catnav button{padding:.45rem 1rem;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:.88rem}
.catnav button.on,.catnav button:hover{background:var(--navy);border-color:var(--navy);color:#fff}

.hero{display:grid;grid-template-columns:2fr 1fr;gap:1rem;max-width:1200px;margin:1rem auto;padding:0 1rem}
.banner{border:0;border-radius:16px;text-align:left;cursor:pointer}
.banner.main{cursor:default;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:.8rem;padding:2.5rem;min-height:300px;color:#fff;background:radial-gradient(circle at 85% 20%,rgba(239,59,45,.55),transparent 45%),radial-gradient(circle at 70% 90%,rgba(255,201,40,.35),transparent 40%),var(--navy)}
.banner h1{margin:0;font-size:clamp(1.5rem,4vw,2.6rem);line-height:1.2;font-weight:800;max-width:18ch}
.banner p{margin:0;color:#cfd6e4;max-width:44ch}
.cta{padding:.8rem 1.8rem;border:0;border-radius:999px;background:var(--grad);color:#1a1205;font-weight:800;cursor:pointer}
.side{display:grid;gap:1rem}
.tile{display:flex;align-items:flex-end;padding:1.2rem;min-height:140px;color:#fff;font-weight:800;font-size:1.2rem}
.t1{background:linear-gradient(135deg,#ef3b2d,#7a1d1d)}
.t2{background:linear-gradient(135deg,#ffc928,#c77d00);color:#1a1205}

.features{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;max-width:1200px;margin:0 auto 1rem;padding:0 1rem}
.features div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;text-align:center;font-size:.88rem}

.title{max-width:1200px;margin:1.5rem auto .5rem;padding:0 1rem;font-size:1.4rem;font-weight:800}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;max-width:1200px;margin:0 auto 1rem;padding:0 1rem}
.bar select{padding:.55rem .8rem;border-radius:8px;border:1px solid var(--line);background:#fff}
#count{margin-left:auto;color:var(--muted);font-size:.9rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;max-width:1200px;margin:0 auto;padding:0 1rem}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:box-shadow .2s}
.card:hover{box-shadow:0 8px 24px rgba(20,28,43,.12)}
.card .img{aspect-ratio:1;background:#eef1f6;display:grid;place-items:center;font-size:2.5rem}
.card img{width:100%;height:100%;object-fit:cover}
.card .info{padding:.85rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.card h3{margin:0;font-size:.92rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--muted)}
.price{font-weight:800;color:var(--red);margin-top:auto}
.old{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:.8rem;margin-left:.4rem}
.add{margin-top:.4rem;padding:.6rem;border-radius:999px;border:0;background:var(--navy);color:#fff;font-weight:600;cursor:pointer}
.add:hover{background:var(--red)}

.pager{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;padding:1.5rem 1rem}
.pager button{min-width:2.5rem;padding:.5rem .8rem;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.pager button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pager button:disabled{opacity:.4;cursor:default}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:3rem 0}

footer{margin-top:2rem;background:var(--navy);color:#cfd6e4;text-align:center;padding:2rem 1rem;font-size:.9rem}
.fcols{display:flex;flex-wrap:wrap;justify-content:center;gap:2.5rem;margin-bottom:1rem;text-align:left}
footer h4{margin:0 0 .3rem;color:var(--gold)}
footer p{margin:0}
footer a{color:var(--gold)}

dialog{width:min(480px,100%);height:100dvh;max-height:100dvh;margin:0 0 0 auto;padding:0;border:0;background:#fff;color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog[open]{display:flex;flex-direction:column}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:1rem}
.dhead h2{margin:0}
.dhead button{background:none;border:0;font-size:1.3rem;cursor:pointer}
#cartItems{flex:1;overflow:auto;padding:0 1rem}
.row{display:grid;grid-template-columns:1fr auto;gap:.3rem .75rem;padding:.75rem 0;border-bottom:1px solid var(--line)}
.row .qty{display:flex;align-items:center;gap:.4rem}
.row .qty button{width:2rem;height:2rem;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
.row .rm{background:none;border:0;color:var(--red);cursor:pointer;font-size:.8rem;padding:0;text-align:left}
.total{display:flex;justify-content:space-between;padding:1rem;font-size:1.1rem;border-top:1px solid var(--line)}
#checkout{display:grid;gap:.6rem;padding:0 1rem 1rem}
#checkout input,#checkout textarea{padding:.7rem;border-radius:8px;border:1px solid var(--line);width:100%}
.note{margin:0;color:var(--muted);font-size:.85rem}
.wa{padding:.85rem;border:0;border-radius:10px;background:var(--wa);color:#06220f;font-weight:800;cursor:pointer}
.wa:disabled{opacity:.5}

@media (max-width:800px){.hero{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.features{grid-template-columns:1fr 1fr}.banner.main{padding:1.5rem;min-height:240px}}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:.6rem}.card h3{font-size:.85rem}.topbar span{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head>
<body>

<div class="topbar">
  <span data-t="f2"></span>
  <div class="langs" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="si">සිං</button><button data-lang="ta">தமி</button>
  </div>
</div>

<header class="head">
  <a class="brand" href="./"><img src="logo.png" alt="Leopis"></a>
  <input id="q" type="search" data-ph="search" autocomplete="off">
  <button id="cartBtn" class="cartbtn"><span data-t="cart"></span> <b id="cartCount">0</b></button>
</header>

<nav id="catNav" class="catnav" aria-label="Categories"></nav>

<section class="hero">
  <div class="banner main">
    <h1 data-t="hero"></h1>
    <p data-t="sub"></p>
    <button class="cta" data-cat="" data-t="shopnow"></button>
  </div>
  <div class="side">
    <button class="banner tile t1" data-cat="Headphones"><span>Headphones</span></button>
    <button class="banner tile t2" data-cat="Home Appliances"><span>Home Appliances</span></button>
  </div>
</section>

<section class="features">
  <div><b data-t="f1"></b></div>
  <div><b data-t="f2"></b></div>
  <div><b data-t="f3"></b></div>
  <div><b data-t="f4"></b></div>
</section>

<h2 id="shop" class="title" data-t="allp"></h2>
<div class="bar">
  <select id="cat" aria-label="Category"></select>
  <select id="sort" aria-label="Sort"></select>
  <span id="count"></span>
</div>

<main id="grid" class="grid"></main>
<nav id="pager" class="pager"></nav>

<footer>
  <div class="fcols">
    <div><h4>Leopis Digital</h4><p data-t="cod"></p></div>
    <div><h4>WhatsApp</h4><p><a id="waLink" href="#">Chat with us</a></p></div>
  </div>
  <p>© Leopis Pvt. Ltd.</p>
</footer>

<dialog id="cartDlg">
  <div class="dhead"><h2 data-t="cart"></h2><button id="closeCart" aria-label="Close">✕</button></div>
  <div id="cartItems"></div>
  <div class="total"><span data-t="total"></span><b id="cartTotal"></b></div>
  <div id="checkout">
    <input id="cName" data-ph="name" autocomplete="name">
    <input id="cPhone" data-ph="phone" type="tel" autocomplete="tel">
    <textarea id="cAddr" data-ph="address" rows="3" autocomplete="street-address"></textarea>
    <p class="note" data-t="cod"></p>
    <button id="order" class="wa" data-t="order"></button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
