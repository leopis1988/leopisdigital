// BULK CSV / EXCEL AUTO CONVERT & CATEGORIZE ENGINE (Supports 2000+ products fast)
function handleCsvUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split('\n');
    let addedCount = 0;

    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      // CSV format expected: Title, Price, Cost, Category, Description, ImageURL
      const cols = line.split(',');
      if (cols.length >= 2) {
        const title = sanitizeInput(cols[0].trim());
        const price = parseFloat(cols[1]) || 5000;
        const cost = parseFloat(cols[2]) || (price * 0.7);
        let category = cols[3] ? sanitizeInput(cols[3].trim()) : "";
        const desc = cols[4] ? sanitizeInput(cols[4].trim()) : "Imported product from catalog.";
        const image = cols[5] ? sanitizeInput(cols[5].trim()) : "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500";

        // Auto-categorization if category is empty based on title keywords
        if (!category || category === "") {
          const tLower = title.toLowerCase();
          if (tLower.includes('watch') || tLower.includes('band')) category = "Smart Watches";
          else if (tLower.includes('earbud') || tLower.includes('headphone') || tLower.includes('audio') || tLower.includes('speaker')) category = "Audio";
          else if (tLower.includes('charger') || tLower.includes('cable') || tLower.includes('adapter') || tLower.includes('power')) category = "Mobile Accessories";
          else if (tLower.includes('smart') || tLower.includes('home') || tLower.includes('bulb')) category = "Smart Home";
          else category = "General Gadgets";
        }

        products.unshift({
          id: Date.now() + i,
          title,
          category,
          price,
          cost,
          special: false,
          desc,
          image
        });
        addedCount++;
      }
    }

    localStorage.setItem('leopis_catalog', JSON.stringify(products));
    renderCategoryTabs();
    renderProducts();
    renderAdminList();
    alert(`Successfully imported ${addedCount} products with auto-categorization! Website remains fast.`);
  };
  reader.readAsText(file);
}

function previewFile() {
  const file = document.getElementById('newImgFile').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height, max = 350;
      if (w > max) { h *= max / w; w = max; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      uploadedBase64 = canvas.toDataURL('image/jpeg', 0.75);
      const prev = document.getElementById('imgPreview');
      prev.src = uploadedBase64; prev.classList.remove('hidden');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

<script>
const translations = {
  en: { store_sl: "Sri Lanka", search_ph: "Search products...", admin_btn: "Admin", banner_sub: "Official Store Sri Lanka", banner_desc: "Premium gadgets & accessories. Cash on Delivery across Sri Lanka.", spec_offers: "Special Offer Products", swipe_txt: "Swipe Left / Right ➔" },
  si: { store_sl: "ශ්‍රී ලංකාව", search_ph: "භාණ්ඩ සොයන්න...", admin_btn: "පරිපාලක", banner_sub: "නිල වෙළඳසැල ශ්‍රී ලංකාව", banner_desc: "උසස් තත්ත්වයේ උපකරණ සහ උපාංග. දිවයින පුරා මුදල් ගෙවීමේ ක්‍රමයට (COD).", spec_offers: "විශේෂ දීමනා", swipe_txt: "වමපසට / දකුණුපසට ස්වයිප් කරන්න ➔" },
  ta: { store_sl: "இலங்கை", search_ph: "பொருட்களை தேட...", admin_btn: "நிர்வாகி", banner_sub: "அதிகாரப்பூர்வ அங்காடி இலங்கை", banner_desc: "பிரீமியம் கேஜெட்டுகள் & துணைக்கருவிகள். இலங்கை முழுவதும் கேஷ் ஆன் டெலிவரி.", spec_offers: "சிறப்பு சலுகைகள்", swipe_txt: "இடது / வலது ஸ்வைப் செய்யவும் ➔" }
};

function setLanguage(lang) {
  ['en', 'si', 'ta'].forEach(l => {
    const btn = document.getElementById(`lang-${l}`);
    if (btn) {
      if (l === lang) {
        btn.className = "px-2 py-0.5 rounded bg-amber-500 text-slate-900 font-bold";
      } else {
        btn.className = "px-2 py-0.5 rounded text-white hover:text-amber-400";
      }
    }
  });

  const t = translations[lang] || translations['en'];
  document.querySelectorAll('[data-tr]').forEach(el => {
    const key = el.getAttribute('data-tr');
    if (t[key]) el.innerText = t[key];
  });
  document.querySelectorAll('[data-tr-placeholder]').forEach(el => {
    const key = el.getAttribute('data-tr-placeholder');
    if (t[key]) el.setAttribute('placeholder', t[key]);
  });
}

function sendAiChat() {
  const input = document.getElementById('chatInput');
  const box = document.getElementById('chatBox');
  const txt = sanitizeInput(input.value.trim());
  if (!txt) return;

  box.innerHTML += `<div class="text-right text-blue-600 font-bold">You: ${txt}</div>`;
  input.value = '';

  setTimeout(() => {
    let reply = aiKnowledge;
    const low = txt.toLowerCase();
    if (low.includes('delivery') || low.includes('time')) reply = "Islandwide delivery takes 2 to 3 working days with Rs 450 delivery fee across Sri Lanka.";
    else if (low.includes('whatsapp') || low.includes('contact')) reply = "You can contact our WhatsApp hotline directly at +94783366466.";
    
    box.innerHTML += `<div class="text-slate-700">AI: ${reply}</div>`;
    box.scrollTop = box.scrollHeight;
  }, 600);
}
</script>
