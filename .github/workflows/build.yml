name: Build Catalog

on:
  push:
    paths:
      - "*.xlsx"
      - "build_catalog.py"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run build_catalog.py
        run: python build_catalog.py

      - name: Commit catalog back
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog_version.txt
          git diff --cached --quiet || git commit -m "Auto-build catalog.json [skip ci]"
          git push
