name: Import Ready Products from Google Sheet

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-sheet-products
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Excel export dependency
        run: python -m pip install openpyxl

      - name: Import Ready products
        run: python import_sheet_products.py

      - name: Sync rate corrections and Excel workbook
        run: python sync_sheet_corrections.py

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products_final.json images/sheet web-product-replacements.xlsx
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "Import Ready products from Google Sheet [skip ci]"
            git push
          fi
