name: Process Products and Add Profit

on:
  push:
    paths:
      - 'products.json'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # <--- நேரத்தை 60 நிமிடங்களாக அதிகரித்துள்ளேன்

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl ddgs

      - name: Run Script to Process Data
        run: python process_products.py

      - name: Commit and Push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add products_final.json Products_with_Profit.xlsx
          git commit -m "Auto-generated products_final.json with real images" || exit 0
          git push
