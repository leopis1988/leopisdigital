name: Process Products and Add Profit

on:
  push:
    paths:
      - 'products.json'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # <-- THIS STOPS THE 25 MINUTE HANG

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pandas openpyxl

      - name: Run Script to Process Data
        run: python process_products.py

      - name: Commit and Push the Excel File
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add Products_with_Profit.xlsx
          git commit -m "Auto-updated: Added +300 profit" || exit 0
          git push
