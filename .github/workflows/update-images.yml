name: Process Products and Add Profit

on:
  push:
    paths:
      - 'products.json'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Increased slightly because downloading 2000 images takes time

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Run Script to Process Data and Download Images
        run: python process_products.py

      - name: Commit and Push Everything
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add images/ products_final.json Products_with_Profit.xlsx
          git commit -m "Auto-update: Downloaded images, added profit, updated JSON" || exit 0
          git push
