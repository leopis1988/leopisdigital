<!-- Product page schema: call once you know the product object `p` (from products.json) -->
<script>
function leopisProductSchema(p){
  var url=location.origin+'/product.html?id='+encodeURIComponent(p.id);
  var until=new Date(Date.now()+30*864e5).toISOString().slice(0,10);
  var data={"@context":"https://schema.org","@type":"Product","name":p.name,"image":[p.image],
    "description":(p.description||p.name).replace(/\s+/g,' ').slice(0,500),"sku":String(p.id),"category":p.category,
    "brand":{"@type":"Brand","name":"Leopis Digital"},
    "offers":{"@type":"Offer","url":url,"priceCurrency":"LKR","price":String(p.price),"priceValidUntil":until,
      "availability":"https://schema.org/InStock","itemCondition":"https://schema.org/NewCondition",
      "seller":{"@type":"Organization","name":"Leopis Digital"},
      "shippingDetails":{"@type":"OfferShippingDetails","shippingDestination":{"@type":"DefinedRegion","addressCountry":"LK"}}}};
  var s=document.createElement('script');s.type='application/ld+json';s.text=JSON.stringify(data);document.head.appendChild(s);
}
/* usage on product page: leopisProductSchema(product); */
</script>
